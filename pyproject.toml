[project]
name = "knowledge-map"
version = "0.1.0"
description = "A local web app for your library of scientific PDFs: metadata, tags, citation graph, recommendations and Claude summaries"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pypdf>=4.0",
    "httpx>=0.27",
]
